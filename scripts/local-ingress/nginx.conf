# Local test ingress for cross-instance SSE failover verification (Phase 17).
#
# TEST HARNESS ONLY. Nothing here is deployed, and nothing in the application
# depends on it. Production ingress is Azure Container Apps, configured in
# infra/azure/modules/app.bicep, which this file does not touch.
#
# Topology it creates:
#
#     browser -> 127.0.0.1:3100 (this nginx)
#                  |-> 127.0.0.1:3101  instance A   (primary)
#                  '-> 127.0.0.1:3102  instance B   (backup)
#             both -> 127.0.0.1:5433  the one local Postgres
#
# `backup` makes routing deterministic, which is the whole point: while A is
# alive every request goes to A, so "the reconnect landed on B" cannot be a
# coincidence of round-robin. Reverse the roles by starting only B.

worker_processes 1;
daemon on;
pid /tmp/attendance-ingress/nginx.pid;
error_log /tmp/attendance-ingress/error.log warn;

events { worker_connections 256; }

http {
  access_log /tmp/attendance-ingress/access.log;
  default_type application/octet-stream;

  # Which instance served a request. Test-only, and produced by the proxy
  # rather than the application: no production code knows this exists, and it
  # carries an address the operator already knows, never a credential.
  log_format upstreamed '$time_iso8601 $status $request_method $uri -> $upstream_addr';
  access_log /tmp/attendance-ingress/routing.log upstreamed;

  upstream attendance_app {
    server 127.0.0.1:3101 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:3102 backup max_fails=1 fail_timeout=2s;
  }

  server {
    listen 127.0.0.1:3100;
    server_name localhost;

    # Same header the test reads from the browser. `always` so it is present on
    # error responses too.
    add_header X-Upstream-Instance $upstream_addr always;

    location / {
      proxy_pass http://attendance_app;

      # THE Phase 16 FINDING. Rewriting Host to the backend's address makes
      # `x-forwarded-host` disagree with `origin`, and Next.js then correctly
      # refuses every Server Action as cross-origin. A real ingress forwards
      # the public host; so does this. Origin validation stays on.
      # `$http_host`, NOT `$host`: the latter drops the port, so the instance
      # saw `localhost` while the browser's Origin was `localhost:3100`, and
      # Next.js refused every Server Action as cross-origin — the same class of
      # failure Phase 16 hit, for a subtler reason. `$http_host` is the Host
      # header exactly as the browser sent it.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      # SSE needs a stream, not a document. Buffering here would hold events
      # until the buffer filled, which for a 200-byte attendance event is
      # "never", and the heartbeat the client watchdog depends on would never
      # arrive either.
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;
      chunked_transfer_encoding on;

      # HTTP/1.1 with a cleared Connection header keeps the upstream socket
      # usable for a long-lived response.
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # The server heartbeats every 15s and the client gives up after 40s of
      # silence. 75s is five heartbeats: long enough that a healthy stream is
      # never cut by the proxy, short enough that a genuinely dead upstream is
      # released rather than parked forever. Deliberately not an arbitrary
      # huge number — an unbounded read timeout hides exactly the failure this
      # phase exists to observe.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_connect_timeout 5s;

      # Move to the backup on a dead or half-dead primary rather than
      # returning the browser an error it would treat as terminal.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
